name: 功能建议
description: 提出新功能或改进想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 在什么场景下遇到了不便？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你希望应用怎样工作？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其他方案或补充
