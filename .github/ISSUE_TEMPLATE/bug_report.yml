name: 问题反馈
description: 报告应用中的错误或异常
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！提交前请先搜索已有 Issue。**请勿粘贴 API Key 等私密信息。**
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 发生了什么？你期望的结果是什么？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 进入「…」
        2. 点击「…」
        3. 出现错误
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 应用版本
      placeholder: 例如 1.1.7
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 手机型号与 Android 版本
      placeholder: 例如 小米 14，Android 15
  - type: dropdown
    id: provider
    attributes:
      label: 文档解析方式（如相关）
      options:
        - 不相关
        - DeepSeek OCR
        - Kimi 文件解析
        - 本地提取文字层
  - type: textarea
    id: extra
    attributes:
      label: 截图或补充信息
